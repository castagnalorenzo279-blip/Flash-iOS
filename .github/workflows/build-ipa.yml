name: Build iOS App
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build unsigned app
        working-directory: FlashMoE-iOS
        run: |
          xcodebuild -project FlashMoE.xcodeproj -scheme FlashMoE -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R FlashMoE-iOS/build/Build/Products/Release-iphoneos/FlashMoE.app Payload/
          zip -qry Flash-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Flash-iOS-ipa
          path: Flash-iOS.ipa
